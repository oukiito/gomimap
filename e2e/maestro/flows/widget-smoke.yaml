# A01-A04. Preconditions: demo A, matching saved locale, one widget placed.
# Use a dedicated emulator and freshly exported expectation.json.
appId: ${APP_ID}
name: Compare app and widget then open the app
tags: [gomimap, isolated-emulator, widget, smoke]
---
- launchApp:
    clearState: false
    stopApp: false
    permissions:
      all: deny
- assertVisible:
    id: schedule-primary-date
    text: ${EXPECTED_DATE_PATTERN}
- assertVisible:
    id: schedule-primary-description
    text: ${EXPECTED_DESCRIPTION_PATTERN}
- assertVisible:
    text: ${EXPECTED_APP_AREA_PATTERN}
- takeScreenshot:
    path: .tooling/maestro-results/${RUN_ID}/A01-app
    cropOn:
      id: schedule-primary
- pressKey: Home
- swipe:
    from:
      id: ${WIDGET_ROWS_ID}
    direction: DOWN
    duration: 300
- assertVisible:
    id: ${WIDGET_DATE_ID}
    text: ${EXPECTED_DATE_PATTERN}
- assertVisible:
    id: ${WIDGET_DESCRIPTION_ID}
    text: ${EXPECTED_DESCRIPTION_PATTERN}
- assertVisible:
    id: ${WIDGET_AREA_ID}
    text: ${EXPECTED_AREA_PATTERN}
- runFlow:
    when:
      true: ${EXPECTED_HAS_DEADLINE == 'true'}
    commands:
      - assertVisible:
          id: ${WIDGET_DEADLINE_ID}
          text: ${EXPECTED_DEADLINE_PATTERN}
- takeScreenshot:
    path: .tooling/maestro-results/${RUN_ID}/A02-widget
    cropOn:
      id: ${WIDGET_ROOT_ID}
- runFlow:
    when:
      true: ${EXPECTED_HAS_SECOND_DEADLINE == 'true'}
    commands:
      - swipe:
          from:
            id: ${WIDGET_ROWS_ID}
          direction: UP
          duration: 300
      - assertVisible:
          id: ${WIDGET_DEADLINE_ID}
          text: ${EXPECTED_DEADLINE_PATTERN}
      - assertVisible:
          id: ${WIDGET_DEADLINE_ID}
          text: ${EXPECTED_SECOND_DEADLINE_PATTERN}
      - takeScreenshot:
          path: .tooling/maestro-results/${RUN_ID}/A02-widget-deadlines
          cropOn:
            id: ${WIDGET_ROOT_ID}
- tapOn:
    id: ${WIDGET_DATE_ID}
- assertVisible:
    id: schedule-primary-date
    text: ${EXPECTED_DATE_PATTERN}
- assertVisible:
    id: schedule-primary-description
    text: ${EXPECTED_DESCRIPTION_PATTERN}
- assertVisible:
    text: ${EXPECTED_APP_AREA_PATTERN}
- takeScreenshot:
    path: .tooling/maestro-results/${RUN_ID}/A03-returned-app
    cropOn:
      id: schedule-primary
