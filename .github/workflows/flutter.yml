name: Flutter checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # Manifest provenance needs the actual last dataset commit.
      - name: Validate source registry and permission gate
        working-directory: .
        run: |
          python3 scripts/validate_sources.py
          python3 scripts/validate_nationwide_survey.py
          python3 scripts/generate_widget_assets.py --check
          python3 -m unittest discover -s scripts/tests -v
      - name: Install pinned Flutter 3.47.6
        working-directory: .
        run: |
          git clone --depth 1 --branch 3.47.6 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = "5fc346839b5d0eef006ed8404392afb4dfae428d"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter pub get --enforce-lockfile
      - name: Prepare and validate owned demo dataset
        run: |
          python3 ../scripts/prepare_demo_data.py
          dart run tool/validate_dataset.dart --allow-fixtures ../data/datasets/fixtures/toshima-demo-v1.json
          python3 ../scripts/cloudflare_data.py prepare
      - run: dart format --output=none --set-exit-if-changed lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --no-pub
